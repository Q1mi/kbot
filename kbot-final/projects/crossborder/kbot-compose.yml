services:
  app:
    environment:
      KBOT_LLM_BASE_URL: http://crossborder-sim:8091/v1
      KBOT_LLM_API_KEY: crossborder-course-key
      KBOT_LLM_MODEL: crossborder-agent-mock
      KBOT_LLM_CHEAP_MODEL: crossborder-agent-mock
      KBOT_OLLAMA_BASE_URL: ""
      KBOT_AUTOSEED_ADMIN: "true"
      KBOT_AUTOSEED_ADMIN_EMAIL: admin@example.com
      KBOT_AUTOSEED_ADMIN_PASSWORD: admin12345
    volumes:
      - ${PWD}/projects/crossborder/knowledge:/scenarios/crossborder/knowledge:ro
    depends_on:
      crossborder-sim:
        condition: service_healthy

  worker:
    environment:
      KBOT_LLM_BASE_URL: http://crossborder-sim:8091/v1
      KBOT_LLM_API_KEY: crossborder-course-key
      KBOT_LLM_MODEL: crossborder-agent-mock
      KBOT_LLM_CHEAP_MODEL: crossborder-agent-mock
      KBOT_OLLAMA_BASE_URL: ""
    volumes:
      - ${PWD}/projects/crossborder/knowledge:/scenarios/crossborder/knowledge:ro
    depends_on:
      crossborder-sim:
        condition: service_healthy

  crossborder-sim:
    build:
      context: ../projects/crossborder
      dockerfile: Dockerfile
    ports:
      - "${CROSSBORDER_PORT:-8091}:8091"
    environment:
      CROSSBORDER_ADDR: ":8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10
