services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kbot}
      POSTGRES_DB: ${POSTGRES_DB:-kbot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.17.1
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro

  sandbox-runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox-runner
    environment:
      KBOT_SANDBOX_RUNNER_ADDR: :8081
      KBOT_SANDBOX_RUNNER_TOKEN: ${KBOT_SANDBOX_RUNNER_TOKEN:?set KBOT_SANDBOX_RUNNER_TOKEN}
      KBOT_SANDBOX_PYTHON_IMAGE: ${KBOT_SANDBOX_PYTHON_IMAGE:-python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7}
      KBOT_SANDBOX_BASH_IMAGE: ${KBOT_SANDBOX_BASH_IMAGE:-busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0}
      KBOT_SANDBOX_MEMORY_MB: ${KBOT_SANDBOX_MEMORY_MB:-256}
      KBOT_SANDBOX_CPUS: ${KBOT_SANDBOX_CPUS:-0.5}
      KBOT_SANDBOX_PIDS_LIMIT: ${KBOT_SANDBOX_PIDS_LIMIT:-64}
      KBOT_SANDBOX_TMPFS_MB: ${KBOT_SANDBOX_TMPFS_MB:-64}
      KBOT_SANDBOX_TIMEOUT: ${KBOT_SANDBOX_TIMEOUT:-30s}
      KBOT_SANDBOX_MAX_CODE_BYTES: ${KBOT_SANDBOX_MAX_CODE_BYTES:-65536}
      KBOT_SANDBOX_MAX_OUTPUT_BYTES: ${KBOT_SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      KBOT_SANDBOX_MAX_CONCURRENT: ${KBOT_SANDBOX_MAX_CONCURRENT:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  crossborder-sim:
    build:
      context: ..
      dockerfile: deploy/scenario.Dockerfile
      args:
        PROJECT: crossborder
    environment:
      CROSSBORDER_ADDR: :8091
    ports:
      - "${KBOT_CROSSBORDER_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  insurance-sim:
    build:
      context: ..
      dockerfile: deploy/scenario.Dockerfile
      args:
        PROJECT: insurance
    environment:
      INSURANCE_ADDR: :8092
    ports:
      - "${KBOT_INSURANCE_PORT:-8092}:8092"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8092/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      KBOT_HTTP_ADDR: :8080
      KBOT_JWT_SECRET: ${KBOT_JWT_SECRET}
      KBOT_JWT_ISSUER: ${KBOT_JWT_ISSUER:-kbot-course}
      KBOT_LLM_BASE_URL: ${KBOT_LLM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      KBOT_LLM_API_KEY: ${KBOT_LLM_API_KEY:?set KBOT_LLM_API_KEY}
      KBOT_LLM_MODEL: ${KBOT_LLM_MODEL:-doubao-seed-2-0-lite-260215}
      KBOT_DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable
      KBOT_BOOTSTRAP_EMAIL: ${KBOT_BOOTSTRAP_EMAIL:?set KBOT_BOOTSTRAP_EMAIL}
      KBOT_BOOTSTRAP_PASSWORD: ${KBOT_BOOTSTRAP_PASSWORD:?set KBOT_BOOTSTRAP_PASSWORD}
      KBOT_BOOTSTRAP_NAME: ${KBOT_BOOTSTRAP_NAME:-Course Admin}
      KBOT_WEBHOOK_SECRET: ${KBOT_WEBHOOK_SECRET:-}
      KBOT_LARK_ENCRYPT_KEY: ${KBOT_LARK_ENCRYPT_KEY:-}
      KBOT_CHANNEL_WORKSPACE_ID: ${KBOT_CHANNEL_WORKSPACE_ID:-}
      KBOT_CHANNEL_AGENT_ID: ${KBOT_CHANNEL_AGENT_ID:-}
      KBOT_CHANNEL_AGENT_ENV: ${KBOT_CHANNEL_AGENT_ENV:-prod}
      KBOT_TOOL_ALLOWED_HOSTS: ${KBOT_TOOL_ALLOWED_HOSTS:-crossborder-sim,insurance-sim,localhost,127.0.0.1}
      KBOT_SANDBOX_RUNNER_URL: http://sandbox-runner:8081
      KBOT_SANDBOX_RUNNER_TOKEN: ${KBOT_SANDBOX_RUNNER_TOKEN:?set KBOT_SANDBOX_RUNNER_TOKEN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
      crossborder-sim:
        condition: service_healthy
      insurance-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KBOT_ADMIN_PORT:-5173}:80"

volumes:
  postgres-data:
